name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build -p uor-prism --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p uor-prism-verify --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p uor-prism-crypto --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p uor-prism-numerics --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p uor-prism-tensor --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p uor-prism-fhe --target thumbv7em-none-eabihf --no-default-features
      - run: cargo run -p wiki-link-check -- --quiet
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::missing_crate_level_docs"

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Per wiki ADR-031 the standard-library sub-crates are published
      # in dependency-graph order: the leaf sub-crates (numerics, crypto,
      # fhe) first, then tensor (depends on numerics), then the prism
      # façade (depends on all four), finally prism-verify (depends on
      # prism). All non-leaf dry-runs use --no-verify so they don't
      # require their (workspace-path) deps to already be on the
      # registry — the real publish step does the verify pass.

      - name: Dry-run publish (uor-prism-numerics)
        run: cargo publish --dry-run -p uor-prism-numerics

      - name: Dry-run publish (uor-prism-crypto)
        run: cargo publish --dry-run -p uor-prism-crypto

      - name: Dry-run publish (uor-prism-fhe)
        run: cargo publish --dry-run -p uor-prism-fhe

      - name: Dry-run publish (uor-prism-tensor)
        run: cargo publish --dry-run -p uor-prism-tensor --no-verify

      - name: Dry-run publish (uor-prism)
        run: cargo publish --dry-run -p uor-prism --no-verify

      - name: Dry-run publish (uor-prism-verify)
        run: cargo publish --dry-run -p uor-prism-verify --no-verify

      - name: Publish uor-prism-numerics
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism-numerics

      - name: Publish uor-prism-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism-crypto

      - name: Publish uor-prism-fhe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism-fhe

      - name: Wait for leaf sub-crates to appear on index
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version=1 --no-deps \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="uor-prism-numerics"))')
          for pkg in uor-prism-numerics uor-prism-crypto uor-prism-fhe; do
            echo "waiting for ${pkg}@${version} to appear on crates.io"
            for i in $(seq 1 60); do
              if curl -sSf -A "uor-prism-release-bot (alex@uor.foundation)" \
                  "https://crates.io/api/v1/crates/${pkg}/${version}" >/dev/null 2>&1; then
                echo "${pkg} available."
                break
              fi
              sleep 10
              if [ "$i" = "60" ]; then
                echo "timed out waiting for ${pkg}" >&2
                exit 1
              fi
            done
          done

      - name: Publish uor-prism-tensor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism-tensor

      - name: Wait for uor-prism-tensor index
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version=1 --no-deps \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="uor-prism-tensor"))')
          echo "waiting for uor-prism-tensor@${version} to appear on crates.io"
          for i in $(seq 1 60); do
            if curl -sSf -A "uor-prism-release-bot (alex@uor.foundation)" \
                "https://crates.io/api/v1/crates/uor-prism-tensor/${version}" >/dev/null 2>&1; then
              echo "available."
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for index propagation" >&2
          exit 1

      - name: Publish uor-prism
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism

      - name: Wait for uor-prism index
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version=1 --no-deps \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="uor-prism"))')
          echo "waiting for uor-prism@${version} to appear on crates.io"
          for i in $(seq 1 60); do
            if curl -sSf -A "uor-prism-release-bot (alex@uor.foundation)" \
                "https://crates.io/api/v1/crates/uor-prism/${version}" >/dev/null 2>&1; then
              echo "available."
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for index propagation" >&2
          exit 1

      - name: Publish uor-prism-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p uor-prism-verify
